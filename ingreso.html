<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPunto · Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header id="barra-superior">
        <h1>EcoPunto</h1>
        <p>Gestión del reciclaje escolar</p>
    </header>
    <main>
        <div class="tarjeta-ingreso">
            <h2>Iniciar sesión</h2>
            <form action="panel-administrador.html">
                <label for="usuario">Usuario</label><br>
                <input type="text" id="usuario" placeholder="Correo institucional"><br>
                <label for="clave">Contraseña</label><br>
                <input type="password" id="clave" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="20"><br>
                <label for="rol">Rol</label><br>
                <select id="rol">
                    <option value="administrador">Administrador</option>
                    <option value="delegado">Delegado de grado</option>
                </select><br>
                <input type="submit" value="Ingresar">
            </form>
        </div>
    </main>
</body>
</html>
